version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Linter: bumps add rules that can fail CI, so upgrade it deliberately in its own PR.
      - dependency-name: "ruff"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
