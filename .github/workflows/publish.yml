name: Publish to PyPI

# Release: add a `## [X.Y.Z]` section to CHANGELOG.md, set __version__ in
# src/molseal/__init__.py to X.Y.Z, commit, then push tag vX.Y.Z. This workflow
# gates on CI, publishes to PyPI, and creates the GitHub Release from the changelog.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build
        run: uv build --out-dir dist/

      - name: Check the tag matches the built version and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/molseal-${version}.tar.gz" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the built version:" dist/*
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # the pypi environment is the one PyPI's trusted publisher is bound to; add
    # required reviewers to it in repo settings to approve each release by hand
    environment:
      name: pypi
      url: https://pypi.org/project/molseal/
    permissions:
      id-token: write # PyPI trusted publishing; also signs the upload's attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned by commit: this step holds the publish credential. v1.14.2 ships
      # twine 7, which accepts the Metadata-Version 2.5 that current hatchling emits.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && (/^## \[/ || /^\[[^]]+\]: /) {exit} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
