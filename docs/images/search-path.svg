<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="A search reads the tenant's change cursor from the database, catches up on new rows only if it moved, runs the query against the in-memory index, and returns ids for the caller to join with its own tables." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2430"/></marker></defs>
  <rect width="900" height="250" rx="10" fill="#ffffff"/>
  <rect x="20" y="40" width="170" height="56" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/><text x="105" y="63" text-anchor="middle" fill="#1b2430">Query</text><text x="105" y="82" text-anchor="middle" font-size="10.5" fill="#5c6a79">SMILES · SMARTS · molblock</text>
  <line x1="190" y1="68" x2="208" y2="68" stroke="#1b2430" stroke-width="1.2" marker-end="url(#d)"/>
  <rect x="210" y="40" width="210" height="56" rx="6" fill="#e3ecf9" stroke="#2456a4" stroke-width="1.2"/><text x="315" y="63" text-anchor="middle" fill="#1b2430">Read the tenant cursor</text><text x="315" y="82" text-anchor="middle" font-size="10.5" fill="#5c6a79">one indexed row in the database</text>
  <line x1="420" y1="68" x2="438" y2="68" stroke="#1b2430" stroke-width="1.2" marker-end="url(#d)"/>
  <rect x="440" y="40" width="250" height="56" rx="6" fill="#e2f2eb" stroke="#1e7a5a" stroke-width="1.2"/><text x="565" y="63" text-anchor="middle" fill="#1b2430">In-memory index</text><text x="565" y="82" text-anchor="middle" font-size="10.5" fill="#5c6a79">substructure library · fingerprint matrices</text>
  <line x1="690" y1="68" x2="708" y2="68" stroke="#1b2430" stroke-width="1.2" marker-end="url(#d)"/>
  <rect x="710" y="40" width="170" height="56" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/><text x="795" y="63" text-anchor="middle" fill="#1b2430">ids (and scores)</text><text x="795" y="82" text-anchor="middle" font-size="10.5" fill="#5c6a79">caller joins its own tables</text>
  <polyline points="315,96 315,150 438,150" fill="none" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#d)"/>
  <text x="325" y="116" font-size="11" fill="#2456a4">only if the cursor moved</text>
  <rect x="440" y="124" width="250" height="52" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="4 3"/><text x="565" y="145" text-anchor="middle" fill="#1b2430">Catch up</text><text x="565" y="164" text-anchor="middle" font-size="10.5" fill="#5c6a79">fetch new rows · decrypt · append</text>
  <line x1="565" y1="124" x2="565" y2="98" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#d)"/>
  <text x="20" y="214" font-size="11" fill="#5c6a79">Read your own writes: a put updates the index in the same call. Other processes catch up on their next search.</text>
  <text x="20" y="232" font-size="11" fill="#5c6a79">A snapshot file, encrypted under the tenant key, makes a fresh process start in seconds instead of rebuilding from the database.</text>
</svg>
