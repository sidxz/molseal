<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="A structure payload is serialized, padded to a size class, encrypted with AES-GCM under an authenticated label, and stored; exact keys are separately hashed with HMAC into their own rows." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2430"/></marker></defs>
  <rect width="900" height="240" rx="10" fill="#ffffff"/>
  <rect x="20" y="30" width="170" height="64" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/><text x="105" y="54" text-anchor="middle" fill="#1b2430">Payload as JSON</text><text x="105" y="73" text-anchor="middle" font-size="11" fill="#5c6a79">SMILES · keys · deleted</text>
  <line x1="190" y1="62" x2="238" y2="62" stroke="#1b2430" stroke-width="1.2" marker-end="url(#c)"/>
  <rect x="240" y="30" width="170" height="64" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/><text x="325" y="54" text-anchor="middle" fill="#1b2430">Pad to a size class</text><text x="325" y="73" text-anchor="middle" font-size="11" fill="#5c6a79">256 · 512 · 1024 bytes · …</text>
  <line x1="410" y1="62" x2="458" y2="62" stroke="#1b2430" stroke-width="1.2" marker-end="url(#c)"/>
  <rect x="460" y="30" width="190" height="64" rx="6" fill="#e3ecf9" stroke="#2456a4" stroke-width="1.2"/><text x="555" y="54" text-anchor="middle" fill="#1b2430">AES-256-GCM</text><text x="555" y="73" text-anchor="middle" font-size="11" fill="#5c6a79">fresh random 96-bit nonce</text>
  <line x1="650" y1="62" x2="698" y2="62" stroke="#1b2430" stroke-width="1.2" marker-end="url(#c)"/>
  <rect x="700" y="30" width="180" height="64" rx="6" fill="#f8e8df" stroke="#b4471d" stroke-width="1.2"/><text x="790" y="54" text-anchor="middle" fill="#1b2430">structures row</text><text x="790" y="73" text-anchor="middle" font-size="11" fill="#5c6a79">nonce + ciphertext</text>
  <text x="555" y="120" text-anchor="middle" font-size="11" fill="#5c6a79">label the cipher checks on every decrypt (AAD):</text>
  <text x="555" y="136" text-anchor="middle" font-size="11" fill="#5c6a79">tenant · row id · key version · row version</text>
  <polyline points="105,94 105,186 238,186" fill="none" stroke="#1b2430" stroke-width="1.2" marker-end="url(#c)"/>
  <text x="115" y="152" font-size="11" fill="#5c6a79">exact keys only</text>
  <rect x="240" y="162" width="250" height="48" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/><text x="365" y="182" text-anchor="middle" fill="#1b2430">HMAC-SHA256</text><text x="365" y="199" text-anchor="middle" font-size="11" fill="#5c6a79">tenant HMAC key · kind · value</text>
  <line x1="490" y1="186" x2="698" y2="186" stroke="#1b2430" stroke-width="1.2" marker-end="url(#c)"/>
  <rect x="700" y="162" width="180" height="48" rx="6" fill="#f8e8df" stroke="#b4471d" stroke-width="1.2"/><text x="790" y="182" text-anchor="middle" fill="#1b2430">structure_keys rows</text><text x="790" y="199" text-anchor="middle" font-size="11" fill="#5c6a79">one per key kind, lookup only</text>
</svg>
