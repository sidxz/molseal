[project]
name = "molseal"
version = "0.0.1"
description = "Encrypted chemical structure store with in-process RDKit search"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
dependencies = [
  "rdkit==2025.3.3",
  "cryptography>=45",
  "numpy>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-kms>=2.21"]
azure = ["azure-keyvault-keys>=4.9", "azure-identity>=1.17"]

[project.scripts]
molseal = "molseal.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
