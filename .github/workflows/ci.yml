name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly: surface CVEs published since the last push
  workflow_dispatch:
  workflow_call: # publish.yml gates every release on this workflow

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: molseal
          POSTGRES_PASSWORD: molseal
          POSTGRES_DB: molseal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U molseal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # without it the PostgreSQL store tests skip themselves
      MOLSEAL_TEST_DATABASE_URL: postgresql+psycopg://molseal:molseal@localhost:5432/molseal
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan locked dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
